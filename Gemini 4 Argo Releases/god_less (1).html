                }
            },
            playTone(freq = 440, duration = 0.22, type = 'sine', gainVal = 0.07) {
                try {
                    this.init();
                    if (!this.ctx) return;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch (e) {}
            },
            playThunder() {
                this.playTone(62, 0.52, 'sawtooth', 0.11);

                const c = document.createElement('canvas');
                c.width = 512; c.height = 512;

                ctx.fillStyle = '#9e3b1c';
                ctx.fillRect(0, 0, 512, 512);
                const rows = 12, cols = 16;
                const rw = 512 / cols, rh = 512 / rows;
                for (let y = 0; y < rows; y++) {
                    for (let x = 0; x < cols; x++) {
                        const shade = (Math.random() - 0.5) * 26;
                        ctx.fillStyle = `rgb(${176 + shade}, ${68 + shade * 0.6}, ${32 + shade * 0.4})`;
                        ctx.fillRect(x * rw + 2, y * rh + 2, rw - 4, rh - 3);
                        // Curved Roman/Greek imbrex ridge highlight
                        const grad = ctx.createLinearGradient(x * rw, y * rh, (x + 1) * rw, y * rh);
                        grad.addColorStop(0, 'rgba(0,0,0,0.38)');
                        grad.addColorStop(0.5, 'rgba(255,210,160,0.28)');
                        grad.addColorStop(1, 'rgba(0,0,0,0.42)');
                        ctx.fillStyle = grad;
                        ctx.fillRect(x * rw, y * rh, rw, rh);
                    }
                    ctx.fillStyle = 'rgba(0,0,0,0.45)';
                    ctx.fillRect(0, y * rh, 512, 3);
                }
                const tex = new THREE.CanvasTexture(c);
                tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
                tex.repeat.set(2, 2);

        function spawnLightningBranch(x1, y1, x2, y2, color, thickness = 2.0) {
            const segments = [];
            const steps = 8;
            let cx = x1, cy = y1;
            for (let i = 1; i <= steps; i++) {
                const t = i / steps;
                const jitter = (1 - Math.abs(t - 0.5) * 2) * 30;
                const nx = x1 + (x2 - x1) * t + (Math.random() - 0.5) * jitter;
                const ny = y1 + (y2 - y1) * t + (Math.random() - 0.5) * jitter;
                segments.push({ x1: cx, y1: cy, x2: nx, y2: ny });
                cx = nx; cy = ny;
            }
            lightningBolts.push({ segments, color, alpha: 1.0, thickness });
        }

        window.addEventListener('mousemove', (e) => {
            const dx = e.clientX - lastMousePos.x;
            const dy = e.clientY - lastMousePos.y;
            const speed = Math.hypot(dx, dy);
            lastMousePos = { x: e.clientX, y: e.clientY };

            if (state.inTitleScreen && speed > 7 && Math.random() < 0.4 * state.lightningIntensity) {
                const boltColor = e.clientX < window.innerWidth * 0.48 ? '#f87171' : '#fde047';
                const angle = Math.random() * Math.PI * 2;
                const reach = 25 + Math.min(speed * 1.3, 85);
                spawnLightningBranch(e.clientX, e.clientY, e.clientX + Math.cos(angle) * reach, e.clientY + Math.sin(angle) * reach, boltColor, 1.7);
            }
            if (state.inTitleScreen && Math.random() < 0.55) {
                cursorEmbers.push({
                    x: e.clientX + (Math.random() - 0.5) * 12,
                    y: e.clientY + (Math.random() - 0.5) * 12,
                    vx: (Math.random() - 0.5) * 1.1,
                    vy: -0.7 - Math.random() * 1.4,
                    size: 1.5 + Math.random() * 2.2,
                    alpha: 0.9,
                    color: Math.random() < 0.7 ? '#fbbf24' : '#38bdf8'
                });
            }
        });

        function renderLightningOverlay() {
            lCtx.clearRect(0, 0, lightningCanvas.width, lightningCanvas.height);
            for (let i = lightningBolts.length - 1; i >= 0; i--) {
                const b = lightningBolts[i];
                lCtx.save();
                lCtx.globalAlpha = b.alpha;
                lCtx.strokeStyle = b.color;
                lCtx.lineWidth = b.thickness;
                lCtx.shadowColor = b.color;
                lCtx.shadowBlur = 12;
                lCtx.beginPath();
                for (const seg of b.segments) {
                    lCtx.moveTo(seg.x1, seg.y1);
                    lCtx.lineTo(seg.x2, seg.y2);
                }
                lCtx.stroke();
                lCtx.restore();
                b.alpha -= 0.06;
                if (b.alpha <= 0) lightningBolts.splice(i, 1);
            }
            for (let i = cursorEmbers.length - 1; i >= 0; i--) {
                const p = cursorEmbers[i];
                p.x += p.vx; p.y += p.vy; p.alpha -= 0.025;
                if (p.alpha <= 0) { cursorEmbers.splice(i, 1); continue; }
                lCtx.save();
                lCtx.globalAlpha = p.alpha;
                lCtx.fillStyle = p.color;
                lCtx.beginPath();
                lCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                lCtx.fill();
                lCtx.restore();
            }
        }

        function pseudoNoise(x, z) {
            return Math.sin(x * 0.045) * Math.cos(z * 0.045) * 2.2
                 + Math.sin(x * 0.11 + z * 0.08) * 0.85
                 + Math.cos(x * 0.23 - z * 0.19) * 0.35;
        }

        function getTerrainHeight(x, z) {
            const distFromCenter = Math.hypot(x, z);
            if (distFromCenter > 154) return -4.8;

            let h = Math.max(-3.6, (1 - Math.pow(distFromCenter / 146, 2.15)) * 8.8) + pseudoNoise(x, z) * 0.52;

            // River canyon
            const riverCurveX = Math.sin(z * 0.035) * 18 - (z > 0 ? z * 0.45 : 0);
            const distToRiver = Math.abs(x - riverCurveX);
            if (distToRiver < 10.5 && z < 48) {
                const riverDepth = Math.cos((distToRiver / 10.5) * (Math.PI / 2)) * 5.8;
                h -= riverDepth;
            }

            // Northern Alpine Range (as seen in sample5 & sample8 background)
            const northDist = Math.hypot(x - 5, z + 100);
            if (northDist < 56) {
                const rawMtn = Math.pow(1 - northDist / 56, 1.5) * 26 + pseudoNoise(x * 1.8, z * 1.8) * 1.6;
                h += Math.round(rawMtn * 0.8) / 0.8 * 0.35 + rawMtn * 0.65;
            }

            // Eastern Highland Plateau
            const eastDist = Math.hypot(x - 95, z - 5);
            if (eastDist < 44) {
                h += Math.min(9.0, Math.pow(1 - eastDist / 44, 1.15) * 12.5);
            }

            // Southern Volcanic Caldera
            const southDist = Math.hypot(x + 10, z - 102);
            if (southDist < 44) {
                h += Math.pow(1 - southDist / 44, 1.45) * 17;
            }

            // Flattened Classical Acropolis & Town Center Plaza
            const centerPlazaDist = Math.hypot(x, z);
            if (centerPlazaDist < 42) {
                const blend = Math.min(1, Math.pow(centerPlazaDist / 42, 1.8));
                h = h * blend + 4.35 * (1 - blend);
            }
            return h;
        }

        const terrainGeo = new THREE.PlaneGeometry(330, 330, 220, 220);
        terrainGeo.rotateX(-Math.PI / 2);
        const posAttr = terrainGeo.attributes.position;
        for (let i = 0; i < posAttr.count; i++) {
            const vx = posAttr.getX(i);
            const vz = posAttr.getZ(i);
            posAttr.setY(i, getTerrainHeight(vx, vz));
        }
        terrainGeo.computeVertexNormals();

        const normAttr = terrainGeo.attributes.normal;
        const colors = [];
        const colorTmp = new THREE.Color();

        for (let i = 0; i < posAttr.count; i++) {
            const vx = posAttr.getX(i);
            const vy = posAttr.getY(i);
            const vz = posAttr.getZ(i);
            const ny = normAttr.getY(i);
            const centerDist = Math.hypot(vx, vz);
            const micro = (Math.sin(vx * 0.21) * Math.cos(vz * 0.21)) * 0.04;

            if (vy < 0.4) {
                colorTmp.setRGB(0.84 + micro, 0.74 + micro, 0.52); // Warm Golden Coastline Sand
            } else if (centerDist < 16) {
                colorTmp.setRGB(0.68 + micro, 0.62 + micro, 0.51 + micro); // Classical Sanctuary Limestone
            } else if (vy > 18.0) {
                colorTmp.setRGB(0.93, 0.95, 0.98); // Snow-Capped Peaks
            } else if (ny < 0.77 || vy > 11.2) {
                colorTmp.setRGB(0.49 + micro, 0.46 + micro, 0.42 + micro); // Rocky Cliffside Strata
            } else if (vz > 68) {
                colorTmp.setRGB(0.38 + micro, 0.29 + micro, 0.23); // Volcanic Scorched Earth
            } else {
                const lush = Math.sin(vx * 0.07) * Math.cos(vz * 0.07) * 0.055;
                colorTmp.setRGB(0.28 + lush + micro, 0.51 + lush + micro, 0.19 + micro); // Sunlit Meadow Grass
            }
            colors.push(colorTmp.r, colorTmp.g, colorTmp.b);
        }
        terrainGeo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

        const terrainMat = new THREE.MeshStandardMaterial({
            vertexColors: true,
            roughness: 0.86,
            metalness: 0.03
        });
        const terrainMesh = new THREE.Mesh(terrainGeo, terrainMat);
        terrainMesh.receiveShadow = true;
        scene.add(terrainMesh);

        // Instanced Wildflower & Lush Grass Meadow (Directly inspired by sample1.jpg!)
        function populateWildflowerMeadow() {
            const flowerColors = [0xa855f7, 0xef4444, 0xfacc15, 0xf97316, 0xec4899, 0x60a5fa];
            const bladeGeo = new THREE.ConeGeometry(0.18, 0.65, 4);
            bladeGeo.translate(0, 0.32, 0);
            const grassMat = new THREE.MeshLambertMaterial({ color: 0x4d8c32 });
            const grassInst = new THREE.InstancedMesh(bladeGeo, grassMat, 1800);

            const dummy = new THREE.Object3D();
            let gIdx = 0;
            for (let i = 0; i < 1800; i++) {
                const a = Math.random() * Math.PI * 2;
                const r = 14 + Math.random() * 78;
                const gx = Math.cos(a) * r;
                const gz = Math.sin(a) * r;
                const gy = getTerrainHeight(gx, gz);
                if (gy < 1.2 || gy > 10.5) continue;
                dummy.position.set(gx, gy, gz);
                dummy.rotation.set((Math.random() - 0.5) * 0.25, Math.random() * Math.PI, (Math.random() - 0.5) * 0.25);
                const s = 0.7 + Math.random() * 0.9;
                dummy.scale.set(s, s, s);
                dummy.updateMatrix();
                grassInst.setMatrixAt(gIdx++, dummy.matrix);
            }
            scene.add(grassInst);

            // Colorful Wildflower Blossoms
            const blossomGeo = new THREE.DodecahedronGeometry(0.16, 0);
            flowerColors.forEach(hex => {

                const fInst = new THREE.InstancedMesh(blossomGeo, fMat, 140);
                for (let j = 0; j < 140; j++) {

                    const fx = Math.cos(a) * r;
                    const fz = Math.sin(a) * r;
                    const fy = getTerrainHeight(fx, fz);

                    dummy.position.set(fx, fy + 0.38, fz);
                    dummy.scale.setScalar(0.8 + Math.random() * 0.7);

                    fInst.setMatrixAt(j, dummy.matrix);

        populateWildflowerMeadow();

        // Water Surface
        const waterGeo = new THREE.PlaneGeometry(460, 460, 48, 48);
        waterGeo.rotateX(-Math.PI / 2);
        const waterMat = new THREE.MeshStandardMaterial({

        });

        // Terrain-Hugging Glowing Emerald/Gold Influence Ribbon (Directly like sample12.png!)
        let influenceRibbonGroup = new THREE.Group();
        scene.add(influenceRibbonGroup);

        function updateInfluenceRing() {
            while (influenceRibbonGroup.children.length > 0) influenceRibbonGroup.remove(influenceRibbonGroup.children[0]);
            const radius = EPOCHS[state.epochIndex].influenceRadius;
            const segs = 128;
            const ringColor = state.alignment < -20 ? 0xef4444 : (state.alignment > 20 ? 0x38bdf8 : 0x4ade80);

            const pts = [];
            for (let i = 0; i <= segs; i++) {
                const a = (i / segs) * Math.PI * 2;
                const rx = Math.cos(a) * radius;
                const rz = Math.sin(a) * radius;
                const ry = Math.max(0.2, getTerrainHeight(rx, rz) + 0.32);
                pts.push(new THREE.Vector3(rx, ry, rz));

            const curve = new THREE.CatmullRomCurve3(pts, true);
            const tubeGeo = new THREE.TubeGeometry(curve, 128, 0.55, 8, true);
            const tubeMat = new THREE.MeshBasicMaterial({ color: ringColor, transparent: true, opacity: 0.75 });
            const outerGlowGeo = new THREE.TubeGeometry(curve, 128, 1.35, 8, true);
            const outerGlowMat = new THREE.MeshBasicMaterial({ color: ringColor, transparent: true, opacity: 0.24 });
            influenceRibbonGroup.add(new THREE.Mesh(tubeGeo, tubeMat), new THREE.Mesh(outerGlowGeo, outerGlowMat));

        // ============================================================================
        // 5. ANATOMICALLY SCULPTED 3D HUMAN HAND OF GOD IN VOLUMETRIC CLOUD MIST
        //    Modeled directly after sample1.jpg & sample13.jpg (Smooth organic fingers,

        const handGroup = new THREE.Group();

        function buildArticulatedHandOfGod() {
            handGroup.add(handRig.wrist);
            handRig.wrist.position.set(0, 3.6, 0);
            handRig.wrist.rotation.x = 0.32;

            // 1. Sculpted Organic Metacarpal Palm (Merged rounded anatomy instead of a flat box)
            const palmCore = new THREE.Mesh(new THREE.SphereGeometry(1.08, 24, 20), handRig.skinMat);

            // Knuckle Ridge Bridge across the 4 fingers
            const knuckleBridge = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.28, 1.56, 16), handRig.skinMat);
            knuckleBridge.rotation.z = Math.PI / 2;
            knuckleBridge.position.set(0, 0.02, -0.88);
            knuckleBridge.scale.set(1, 1, 0.72);

            // Muscular Thenar Eminence (Thumb base muscle pad) & Hypothenar heel pad
            const thenarPad = new THREE.Mesh(new THREE.SphereGeometry(0.54, 16, 14), handRig.skinMat);
            thenarPad.scale.set(0.85, 0.55, 1.25);
            thenarPad.position.set(-0.62, -0.14, 0.12);
            thenarPad.rotation.y = 0.4;
            handRig.wrist.add(thenarPad);

            // Smooth Tapered Wrist disappearing into the Cloud Mist
            const wristNeck = new THREE.Mesh(new THREE.CylinderGeometry(0.68, 0.58, 1.65, 20), handRig.skinMat);
            wristNeck.rotation.x = Math.PI / 2.2;
            wristNeck.position.set(0, 0.25, 1.45);
            handRig.wrist.add(wristNeck);

            // 2. Five Anatomically Tapered Fingers with Smooth Joints & Fingernails
            const fingerSpecs = [
                { x: -0.66, y: 0.01, z: -0.92, spread:  0.08, len: 0.68, r: 0.185 }, // Index
                { x: -0.22, y: 0.04, z: -1.00, spread:  0.02, len: 0.76, r: 0.195 }, // Middle
                { x:  0.23, y: 0.02, z: -0.95, spread: -0.03, len: 0.70, r: 0.185 }, // Ring
                { x:  0.64, y: -0.03, z: -0.82, spread: -0.10, len: 0.56, r: 0.155 } // Pinky
            ];

            fingerSpecs.forEach((spec) => {
                const knucklePivot = new THREE.Group();
                knucklePivot.position.set(spec.x, spec.y, spec.z);
                knucklePivot.rotation.y = spec.spread;
                handRig.wrist.add(knucklePivot);

                const kJoint = new THREE.Mesh(new THREE.SphereGeometry(spec.r * 1.04, 14, 14), handRig.skinMat);
                knucklePivot.add(kJoint);

                // Proximal Phalanx
                const prox = new THREE.Mesh(new THREE.CylinderGeometry(spec.r * 0.88, spec.r * 1.02, spec.len, 16), handRig.skinMat);
                prox.rotation.x = Math.PI / 2;
                prox.position.z = -spec.len / 2;
                prox.castShadow = true;
                knucklePivot.add(prox);

                // PIP Middle Joint
                const midPivot = new THREE.Group();
                midPivot.position.z = -spec.len;
                knucklePivot.add(midPivot);

                const mJoint = new THREE.Mesh(new THREE.SphereGeometry(spec.r * 0.88, 14, 14), handRig.skinMat);
                midPivot.add(mJoint);

                const midLen = spec.len * 0.78;
                const midMesh = new THREE.Mesh(new THREE.CylinderGeometry(spec.r * 0.76, spec.r * 0.88, midLen, 16), handRig.skinMat);
                midMesh.rotation.x = Math.PI / 2;
                midMesh.position.z = -midLen / 2;
                midMesh.castShadow = true;
                midPivot.add(midMesh);

                // DIP Distal Joint & Fingertip with Realistic Fingernail
                const tipPivot = new THREE.Group();
                tipPivot.position.z = -midLen;
                midPivot.add(tipPivot);

                const tJoint = new THREE.Mesh(new THREE.SphereGeometry(spec.r * 0.76, 12, 12), handRig.skinMat);
                tipPivot.add(tJoint);

                const tipLen = spec.len * 0.65;
                const tipMesh = new THREE.Mesh(new THREE.CylinderGeometry(spec.r * 0.62, spec.r * 0.76, tipLen, 16), handRig.skinMat);
                tipMesh.rotation.x = Math.PI / 2;
                tipMesh.position.z = -tipLen / 2;
                tipPivot.add(tipMesh);

                const fingerPad = new THREE.Mesh(new THREE.SphereGeometry(spec.r * 0.64, 14, 14), handRig.skinMat);
                fingerPad.scale.set(1.0, 0.82, 1.15);
                fingerPad.position.z = -tipLen;
                tipPivot.add(fingerPad);

                // Fingernail plate on top of distal phalanx
                const nail = new THREE.Mesh(new THREE.BoxGeometry(spec.r * 0.88, 0.03, tipLen * 0.55), handRig.nailMat);
                nail.position.set(0, spec.r * 0.54, -tipLen * 0.72);
                nail.rotation.x = 0.08;
                tipPivot.add(nail);

                handRig.fingers.push({ knucklePivot, midPivot, tipPivot, baseSpread: spec.spread });
            });

            // 3. Sculpted Opposable Thumb with Nail
            const thumbBase = new THREE.Group();
            thumbBase.position.set(-0.88, -0.10, -0.18);
            thumbBase.rotation.set(0.15, 0.68, -0.25);
            handRig.wrist.add(thumbBase);

            const thumbProx = new THREE.Mesh(new THREE.CylinderGeometry(0.19, 0.24, 0.65, 16), handRig.skinMat);
            thumbProx.rotation.x = Math.PI / 2;
            thumbProx.position.z = -0.32;
            thumbBase.add(thumbProx);

            const thumbTipPivot = new THREE.Group();
            thumbTipPivot.position.z = -0.65;
            thumbBase.add(thumbTipPivot);

            const thumbJoint = new THREE.Mesh(new THREE.SphereGeometry(0.19, 12, 12), handRig.skinMat);
            thumbTipPivot.add(thumbJoint);

            const thumbDist = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.19, 0.56, 16), handRig.skinMat);
            thumbDist.rotation.x = Math.PI / 2;
            thumbDist.position.z = -0.28;
            thumbTipPivot.add(thumbDist);

            const thumbPad = new THREE.Mesh(new THREE.SphereGeometry(0.16, 12, 12), handRig.skinMat);
            thumbPad.position.z = -0.56;
            thumbTipPivot.add(thumbPad);

            const thumbNail = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.03, 0.28), handRig.nailMat);
            thumbNail.position.set(0, 0.13, -0.42);
            thumbTipPivot.add(thumbNail);

            handRig.thumb = { thumbBase, thumbTipPivot };

            // 4.Glowing Magical Energy Orb held in the Hand (Directly like sample1.jpg!)
            const orbGroup = new THREE.Group();
            orbGroup.position.set(0, -0.32, -0.55);
            const innerOrb = new THREE.Mesh(
                new THREE.SphereGeometry(0.46, 20, 20),
                new THREE.MeshBasicMaterial({ color: 0xe0f2fe, transparent: true, opacity: 0.85 })
            );
            const outerAuraOrb = new THREE.Mesh(
                new THREE.SphereGeometry(0.76, 20, 20),
                new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.32, wireframe: true })
            );
            orbGroup.add(innerOrb, outerAuraOrb);
            handRig.wrist.add(orbGroup);
            handRig.palmOrb = orbGroup;

            // 5. Billowing Volumetric Cloud Mist around Wrist & Hand (sample1.jpg & sample13.jpg)
            for (let i = 0; i < 16; i++) {
                const sMat = new THREE.SpriteMaterial({
                    map: cloudMistTex,
                    color: 0xdbeafe,
                    transparent: true,
                    opacity: 0.62,
                    depthWrite: false,
                    blending: THREE.AdditiveBlending
                });
                const sp = new THREE.Sprite(sMat);
                const angle = (i / 16) * Math.PI * 2;

                    Math.cos(angle) * rad,
                    0.15 + (Math.random() - 0.5) * 0.45,
                    1.15 + Math.sin(angle) * 0.65 + (i % 2) * 0.4
                );
                const sz = 2.1 + (i % 4) * 0.55;
                sp.scale.set(sz, sz, 1);
                sp.userData = { baseAngle: angle, rad, baseZ: sp.position.z, speed: 0.8 + Math.random() * 0.8, phase: i * 0.6 };
                handRig.wrist.add(sp);
                handRig.cloudSprites.push(sp);
            }

            // Ground projection halo
            const groundRing = new THREE.Mesh(
                new THREE.RingGeometry(1.2, 1.75, 40),
                new THREE.MeshBasicMaterial({ color: 0x7dd3fc, side: THREE.DoubleSide, transparent: true, opacity: 0.52 })
            );

            groundRing.position.y = 0.14;
            handGroup.add(groundRing);

            handRig.auraLight.position.set(0, 2.2, 0);
            handGroup.add(handRig.auraLight);
            scene.add(handGroup);
        }
        buildArticulatedHandOfGod();

        function animateHandOfGod(dt, now) {
            if (state.heldObject) {
                handRig.curlTarget = 1.08; // Gripping object
            } else if (isDrawingGesture) {
                handRig.curlTarget = 0.88; // Pointing index finger like sample13.jpg
            } else if (state.hoveredEntity) {
                handRig.curlTarget = 0.45; // Cradling magical energy orb like sample1.jpg
            } else {
                handRig.curlTarget = 0.26 + Math.sin(now * 0.0028) * 0.06;
            }

            handRig.curlCurrent += (handRig.curlTarget - handRig.curlCurrent) * Math.min(1, dt * 12);

            // Gentle floating motion of the wrist in its cloud
            handRig.wrist.position.y = 3.55 + Math.sin(now * 0.0032) * 0.16;
            handRig.wrist.rotation.z = Math.sin(now * 0.0018) * 0.05;

            handRig.fingers.forEach((f, idx) => {
                const wave = Math.sin(now * 0.004 + idx * 0.55) * 0.04;
                const c = (isDrawingGesture && idx === 0) ? 0.05 : (handRig.curlCurrent + wave);
                f.knucklePivot.rotation.x = -c * 0.72;
                f.midPivot.rotation.x = -c * 0.96;
                f.tipPivot.rotation.x = -c * 0.68;
            });

            if (handRig.thumb) {
                handRig.thumb.thumbBase.rotation.x = 0.15 - handRig.curlCurrent * 0.48;
                handRig.thumb.thumbBase.rotation.z = -0.25 - handRig.curlCurrent * 0.42;
                handRig.thumb.thumbTipPivot.rotation.x = -handRig.curlCurrent * 0.65;
            }

            // Animate swirling cloud mist sprites & palm energy orb
            if (handRig.palmOrb) {
                handRig.palmOrb.rotation.y += dt * 1.8;
                handRig.palmOrb.rotation.z -= dt * 1.2;
                const orbScale = state.heldObject ? 0.01 : (isDrawingGesture || state.hoveredEntity ? 1.15 : 0.78);
                handRig.palmOrb.scale.setScalar(orbScale + Math.sin(now * 0.006) * 0.06);
            }

            const cloudTint = state.alignment < -25 ? 0xfca5a5 : (state.alignment > 25 ? 0xbae6fd : 0xe0f2fe);
            handRig.cloudSprites.forEach((sp) => {
                const u = sp.userData;
                const a = u.baseAngle + now * 0.0008 * u.speed;
                sp.position.x = Math.cos(a) * u.rad;
                sp.position.y = 0.15 + Math.sin(now * 0.003 + u.phase) * 0.22;
                sp.material.color.setHex(cloudTint);
            });
        }

        // ============================================================================
        // 6. CLASSICAL DOMED TEMPLE, TOWN CENTER PLAZA & MULTI-STAGE BUILDINGS
        //    Includes rotating construction cranes, rising masonry, and 4-stage

        // ============================================================================
        const buildings = [];
        const resourcesNodes = [];

        const sharedMats = {

        function createCobbleRoadTo(targetX, targetZ) {
            const dist = Math.hypot(targetX, targetZ);
            if (dist < 5) return;
            const steps = Math.floor(dist / 2.2);
            for (let i = 1; i <= steps; i++) {
                const t = i / steps;
                const rx = targetX * t + Math.sin(t * Math.PI) * 0.9;
                const rz = targetZ * t;
                const ry = getTerrainHeight(rx, rz);
                const roadTile = new THREE.Mesh(new THREE.CylinderGeometry(1.55, 1.65, 0.10, 12), sharedMats.cobble);
                roadTile.position.set(rx, ry + 0.03, rz);
                roadTile.receiveShadow = true;
                scene.add(roadTile);
                roadDecals.push(roadTile);
            }
        }

        // Classical Domed Temple + Circular Town Center Plaza (Modeled directly after sample12.png & sample13.jpg!)
        const templeGroup = new THREE.Group();
        scene.add(templeGroup);

        function rebuildTempleMesh() {
            while (templeGroup.children.length > 0) templeGroup.remove(templeGroup.children[0]);
            const epochId = EPOCHS[state.epochIndex].id;
            templeGroup.position.set(-14, getTerrainHeight(-14, -4), -4);

            // 1. Stepped Marble Acropolis Podium & Grand Front Staircase (sample12.png left)
            const podium = new THREE.Mesh(new THREE.BoxGeometry(11.5, 2.2, 13.5), sharedMats.marble);
            podium.position.y = 1.1;
            podium.castShadow = true;
            podium.receiveShadow = true;
            templeGroup.add(podium);

        // Multi-Stage AoE4 / B&W2 Building System with Rotating Construction Crane, Rising Brickwork,
        // Fire/Smoke Plumes, and Falling Rubble Physics
        function createDetailedBuilding(type, x, z, isPrebuilt = false) {
            const y = getTerrainHeight(x, z);
            const root = new THREE.Group();
            root.position.set(x, y, z);

            // 1. Stone Foundation & Courtyard Plinth
            const foundation = new THREE.Mesh(new THREE.BoxGeometry(5.6, 0.55, 5.0), sharedMats.stone);
            foundation.position.y = 0.27;
            foundation.receiveShadow = true;
            root.add(foundation);

            // 2. Detailed AoE4 Construction Scaffolding + Rotating Medieval Wooden Crane
            const scaffoldGroup = new THREE.Group();
            const postCoords = [[-2.6, -2.2], [2.6, -2.2], [-2.6, 2.2], [2.6, 2.2], [0, -2.2], [0, 2.2]];

                scaffoldGroup.add(pole);

            for (let h = 1.3; h <= 3.9; h += 1.3) {
                const plankF = new THREE.Mesh(new THREE.BoxGeometry(5.4, 0.10, 0.45), sharedMats.scaffold);
                plankF.position.set(0, h, 2.2);
                const plankB = plankF.clone(); plankB.position.z = -2.2;
                scaffoldGroup.add(plankF, plankB);
            }

            // Rotating Treadwheel Crane (`Baukran`) on side of construction site

            cranePivot.position.set(-2.9, 0.5, 0);
            const craneMast = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.20, 5.4, 8), sharedMats.timber);

            const craneBoom = new THREE.Mesh(new THREE.BoxGeometry(3.8, 0.18, 0.18), sharedMats.timber);

            const craneRope = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 2.2, 6), sharedMats.scaffold);
            craneRope.position.set(2.9, 4.3, 0);
            const suspendedBlock = new THREE.Mesh(new THREE.BoxGeometry(0.65, 0.45, 0.45), sharedMats.marble);
            suspendedBlock.position.set(2.9, 3.1, 0);
            cranePivot.add(craneMast, craneBoom, craneRope, suspendedBlock);
            scaffoldGroup.add(cranePivot);
            root.add(scaffoldGroup);

            // 3. Detailed Main Architecture + Exposed Timber Rafters + Terracotta Tiled Roof

            const raftersGroup = new THREE.Group();
            const roofGroup = new THREE.Group();
            let windmillSails = null;

            // Exposed wooden roof trusses visible during 55%-85% construction or heavy damage!

                trussL.rotation.x = 0.65;
                const trussR = trussL.clone();
                trussR.position.z = 0.65;
                trussR.rotation.x = -0.65;
                raftersGroup.add(trussL, trussR);
            }
            mainGroup.add(raftersGroup);

            if (type === 'house') {
                // Classical 2-Story Greco-Roman Villa with Terracotta Roof, Colonnade Porch & Chimney (sample5 & sample12)
                const lowerBody = new THREE.Mesh(new THREE.BoxGeometry(4.2, 2.6, 3.6), sharedMats.facade);
                lowerBody.position.y = 1.6;
                lowerBody.castShadow = true;
                mainGroup.add(lowerBody);

                // Side Wing / L-Shape Annex (like sample12.png villas!)

            } else if (type === 'warehouse') {
                const hall = new THREE.Mesh(new THREE.BoxGeometry(4.6, 2.6, 3.6), sharedMats.facade);

                mainGroup.add(hall);
                for (let c = 0; c < 4; c++) {
                    const crate = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.7, 0.7), sharedMats.scaffold);

            } else if (type === 'barracks') {
                const keep = new THREE.Mesh(new THREE.BoxGeometry(4.8, 3.0, 4.0), sharedMats.stone);
                keep.position.y = 1.75;
                keep.castShadow = true;
                mainGroup.add(keep);
                [[-2.2, -1.8], [2.2, -1.8], [-2.2, 1.8], [2.2, 1.8]].forEach(([tx, tz]) => {
                    const tower = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 0.78, 4.2, 10), sharedMats.stone);
                    tower.position.set(tx, 2.35, tz);
                    tower.castShadow = true;
                    mainGroup.add(tower);
                    const tRoof = new THREE.Mesh(new THREE.ConeGeometry(0.88, 1.1, 10), sharedMats.terracotta);
                    tRoof.position.set(tx, 4.95, tz);
                    roofGroup.add(tRoof);
                });
            } else if (type === 'shrine') {
                const podium = new THREE.Mesh(new THREE.CylinderGeometry(2.1, 2.4, 1.2, 16), sharedMats.marble);
                podium.position.y = 0.85;
                mainGroup.add(podium);
                for (let c = 0; c < 8; c++) {
                    const a = (Math.PI * 2 * c) / 8;
                    const pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.20, 0.24, 2.6, 10), sharedMats.marble);
                    pillar.position.set(Math.cos(a) * 1.65, 2.65, Math.sin(a) * 1.65);
                    mainGroup.add(pillar);
                }
                const dome = new THREE.Mesh(new THREE.SphereGeometry(1.75, 16, 12, 0, Math.PI * 2, 0, Math.PI / 2), sharedMats.verdiDome);
                dome.position.y = 3.95;
                roofGroup.add(dome);
            }

            mainGroup.add(roofGroup);
            root.add(mainGroup);

            // 4. Multi-Stage Destruction FX Group: Flickering Fire Sprites, Rising Black Smoke & Half-Walls (sample1 & sample12)
            const fireSmokeGroup = new THREE.Group();
            const fireSprites = [];
            for (let f = 0; f < 4; f++) {
                const fs = new THREE.Sprite(new THREE.SpriteMaterial({ map: fireSpriteTex, blending: THREE.AdditiveBlending, transparent: true }));
                fs.position.set((f - 1.5) * 0.9, 1.8 + (f % 2) * 0.8, (f % 2 === 0 ? 1 : -1) * 0.8);
                fs.scale.set(2.2, 2.6, 1);
                fireSmokeGroup.add(fs);
                fireSprites.push(fs);
            }
            const smokeSprites = [];
            for (let sm = 0; sm < 5; sm++) {
                const ss = new THREE.Sprite(new THREE.SpriteMaterial({ map: smokeSpriteTex, transparent: true, opacity: 0.65 }));
                ss.position.set((Math.random() - 0.5) * 1.8, 3.2 + sm * 1.1, (Math.random() - 0.5) * 1.8);
                ss.scale.set(2.8 + sm * 0.5, 2.8 + sm * 0.5, 1);
                ss.userData = { baseY: ss.position.y, offset: sm * 1.3 };
                fireSmokeGroup.add(ss);
                smokeSprites.push(ss);
            }
            fireSmokeGroup.visible = false;
            root.add(fireSmokeGroup);

            // 5. Destroyed Ruins & Jagged Broken Wall Stumps (sample12.png bottom-left!)
            const rubbleGroup = new THREE.Group();
            for (let r = 0; r < 8; r++) {
                const a = (r / 8) * Math.PI * 2;
                const stump = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.7 + (r % 3) * 0.45, 0.45), r % 2 === 0 ? sharedMats.charred : sharedMats.stone);
                stump.position.set(Math.cos(a) * 1.75, 0.65, Math.sin(a) * 1.45);
                stump.rotation.y = a + Math.PI / 2;
                stump.rotation.z = (Math.random() - 0.5) * 0.25;
                rubbleGroup.add(stump);
            }
            rubbleGroup.visible = false;
            root.add(rubbleGroup);

            const bObj = {
                type,
                mesh: root,
                x, z,
                buildProgress: isPrebuilt ? 100 : 8,
                hp: 100,
                maxHp: 100,
                state: isPrebuilt ? 'complete' : 'constructing',
                scaffoldGroup,
                cranePivot,
                mainGroup,
                raftersGroup,
                roofGroup,
                fireSmokeGroup,
                fireSprites,
                smokeSprites,
                rubbleGroup,
                windmillSails
            };

            root.userData = { entityType: 'building', buildingRef: bObj };
            updateBuildingVisualState(bObj);

            scene.add(root);
            createCobbleRoadTo(x, z);
            buildings.push(bObj);
            updateHUD();
            return bObj;
        }

        function spawnDestructionDebris(x, y, z, count = 16) {
            for (let i = 0; i < count; i++) {
                const chunk = new THREE.Mesh(
                    new THREE.DodecahedronGeometry(0.28 + Math.random() * 0.25, 0),
                    i % 2 === 0 ? sharedMats.terracotta : sharedMats.charred
                );
                chunk.position.set(x + (Math.random() - 0.5) * 2.5, y + 1.5 + Math.random() * 2, z + (Math.random() - 0.5) * 2.5);
                chunk.userData = {
                    vx: (Math.random() - 0.5) * 9,
                    vy: 4 + Math.random() * 7,
                    vz: (Math.random() - 0.5) * 9,
                    gravity: 16,
                    life: 1.6 + Math.random() * 0.8
                };
                scene.add(chunk);
                particles.push(chunk);
            }
        }

        function updateBuildingVisualState(b) {
            if (b.hp <= 0) {
                if (b.state !== 'ruins') {
                    spawnDestructionDebris(b.x, b.mesh.position.y, b.z, 24);
                }
                b.state = 'ruins';
                b.mainGroup.visible = false;
                b.scaffoldGroup.visible = false;
                b.fireSmokeGroup.visible = true;
                b.rubbleGroup.visible = true;
                return;
            }

            if (b.buildProgress < 100) {
                b.state = 'constructing';
                b.scaffoldGroup.visible = true;
                b.mainGroup.visible = true;
                b.fireSmokeGroup.visible = false;
                b.rubbleGroup.visible = false;

                // Smooth staged vertical masonry rise + roof rafters before tiles!
                const p = Math.max(0.12, b.buildProgress / 100);
                b.mainGroup.scale.set(1, Math.min(1, p * 1.15), 1);
                b.raftersGroup.visible = b.buildProgress >= 45 && b.buildProgress < 88;
                b.roofGroup.visible = b.buildProgress >= 78;
            } else {
                b.mainGroup.visible = true;
                b.mainGroup.scale.set(1, 1, 1);
                if (b.hp < 40) {
                    // Heavy Damage: Exposed charred rafters, missing tiled roof, raging fire & smoke!
                    b.state = 'critical_damage';
                    b.roofGroup.visible = false;
                    b.raftersGroup.visible = true;
                    b.scaffoldGroup.visible = false;
                    b.fireSmokeGroup.visible = true;
                    b.rubbleGroup.visible = true;
                } else if (b.hp < 80) {
                    // Moderate Damage: Roof intact, fires burning & smoke rising
                    b.state = 'damaged';
                    b.roofGroup.visible = true;
                    b.raftersGroup.visible = false;
                    b.scaffoldGroup.visible = false;
                    b.fireSmokeGroup.visible = true;
                    b.rubbleGroup.visible = false;
                } else {
                    // Pristine Completed Building
                    b.state = 'complete';
                    b.roofGroup.visible = true;
                    b.raftersGroup.visible = false;
                    b.scaffoldGroup.visible = false;
                    b.fireSmokeGroup.visible = false;
                    b.rubbleGroup.visible = false;
                }
            }
        }

            for (let i = 0; i < 105; i++) {
                const angle = Math.random() * Math.PI * 2;
                const radius = 26 + Math.random() * 98;
                const tx = Math.cos(angle) * radius;
                const tz = Math.sin(angle) * radius;
                const ty = getTerrainHeight(tx, tz);
                if (ty < 1.2 || ty > 15.5) continue;

                const treeGroup = new THREE.Group();
                treeGroup.position.set(tx, ty, tz);

                const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.34, 2.4, 8), sharedMats.timber);
                trunk.position.y = 1.2;
                trunk.castShadow = true;
                treeGroup.add(trunk);

                const mat = treeFoliageMaterials[i % 2];
                // 4-tiered overlapping conifer boughs like the pine trees in sample5.jpg & sample8.jpg
                for (let layer = 0; layer < 4; layer++) {
                    const coneR = 1.75 - layer * 0.34;
                    const coneH = 1.85 - layer * 0.18;
                    const bough = new THREE.Mesh(new THREE.ConeGeometry(coneR, coneH, 9), mat);
                    bough.position.y = 2.1 + layer * 1.05;
                    bough.rotation.y = layer * 0.5;
                    bough.castShadow = true;
                    treeGroup.add(bough);
                }

                const s = 0.85 + Math.random() * 0.45;
                treeGroup.scale.setScalar(s);
                treeGroup.userData = { entityType: 'resource', resType: 'wood', amount: 45 };
                scene.add(treeGroup);
                resourcesNodes.push(treeGroup);
            }

            for (let i = 0; i < 24; i++) {
                const angle = Math.random() * Math.PI * 2;
                const radius = 24 + Math.random() * 88;
                const ox = Math.cos(angle) * radius;
                const oz = Math.sin(angle) * radius;
                const oy = getTerrainHeight(ox, oz);
                if (oy < 1.5) continue;

                const veinGroup = new THREE.Group();
                veinGroup.position.set(ox, oy, oz);

                const baseRock = new THREE.Mesh(new THREE.DodecahedronGeometry(1.35, 1), sharedMats.stone);
                baseRock.scale.set(1.2, 0.75, 1.1);

        // Update Articulated Bipedal Creature AI & Full-Body Kinematic Animations
        let creatureDecisionTimer = 0;
        function updateCreatureAI(dt, now) {
            const c = state.creature;
            if (!c.mesh) return;

            creatureDecisionTimer -= dt;
            if (creatureDecisionTimer <= 0) {
                creatureDecisionTimer = 4.6;
                c.hunger = Math.min(100, c.hunger + 1.0);

                const needyBuilding = buildings.find(b => b.buildProgress < 100 || (b.hp < b.maxHp && b.hp > 0));
                if ((c.role === 'builder' || c.role === 'free') && needyBuilding) {
                    c.targetPos.set(needyBuilding.x + 3.4, 0, needyBuilding.z + 3.2);
                    c.stateText = 'Baut & repariert Bauwerk';
                    c.animMode = 'work';
                    c.animTimer = 3.2;
                    needyBuilding.buildProgress = Math.min(100, needyBuilding.buildProgress + 24);
                    needyBuilding.hp = Math.min(needyBuilding.maxHp, needyBuilding.hp + 22);
                    updateBuildingVisualState(needyBuilding);
                    addFaith(5);
                } else if (c.role === 'gather') {
                    c.stateText = 'Sammelt Holz & Korn für dein Lager';
                    c.animMode = 'work';
                    state.resources.wood += 6;
                    state.resources.food += 6;
                } else if (c.role === 'entertain') {
                    c.stateText = 'Begeistert deine Siedler (+Glaube)';
                    c.animMode = 'roar';
                    c.animTimer = 2.5;
                    addFaith(7);
                } else if (c.role === 'soldier') {
                    c.stateText = 'Brüllt & bewacht die Reichsgrenzen';
                    c.animMode = 'roar';
                    c.animTimer = 2.5;
                    state.tribes.vikings.impress = Math.min(100, state.tribes.vikings.impress + 2);
                } else {
                    c.stateText = 'Denkt nach & wacht über die Polis';
                    c.animMode = Math.random() < 0.65 ? 'think' : 'roar';
                    c.animTimer = 3.5;
                    addFaith(2);
                }

                if (!needyBuilding || c.role !== 'builder') {
                    if (Math.random() < 0.6) {
                        const angle = Math.random() * Math.PI * 2;
                        const dist = 12 + Math.random() * (EPOCHS[state.epochIndex].influenceRadius * 0.48);
                        c.targetPos.set(Math.cos(angle) * dist, 0, Math.sin(angle) * dist);
                    }
                }
                updateHUD();
            }

            const dx = c.targetPos.x - c.mesh.position.x;
            const dz = c.targetPos.z - c.mesh.position.z;
            const dist = Math.hypot(dx, dz);
            const j = c.joints;
            if (!j || !j.pelvisGroup) return;

            if (dist > 0.85) {
                // Full Bipedal Stride Animation (Pelvis bob, Knee flexion, Arm counter-swing, Spine twist)
                const speed = 6.4 * dt;
                c.mesh.position.x += (dx / dist) * speed;
                c.mesh.position.z += (dz / dist) * speed;

                // Smooth yaw turn
                const targetYaw = Math.atan2(dx, dz);
                let diff = targetYaw - c.mesh.rotation.y;
                while (diff > Math.PI) diff -= Math.PI * 2;
                while (diff < -Math.PI) diff += Math.PI * 2;
                c.mesh.rotation.y += diff * Math.min(1, dt * 7);

                c.walkPhase += dt * 6.8;
                const s = Math.sin(c.walkPhase);
                const cWave = Math.cos(c.walkPhase);

                j.pelvisGroup.position.y = 3.1 + Math.abs(s) * 0.26;
                j.pelvisGroup.rotation.z = cWave * 0.06;
                j.spineGroup.rotation.x = 0.14; // Forward stride lean
                j.spineGroup.rotation.y = -s * 0.12;

                j.leftLeg.hipPivot.rotation.x = s * 0.58;
                j.leftLeg.kneePivot.rotation.x = Math.max(0, -cWave * 0.65);
                j.rightLeg.hipPivot.rotation.x = -s * 0.58;
                j.rightLeg.kneePivot.rotation.x = Math.max(0, cWave * 0.65);

                j.leftArm.shoulderPivot.rotation.x = -s * 0.45;
                j.leftArm.elbowPivot.rotation.x = -0.35 - Math.max(0, s * 0.35);
                j.rightArm.shoulderPivot.rotation.x = s * 0.45;
                j.rightArm.elbowPivot.rotation.x = -0.35 - Math.max(0, -s * 0.35);
                j.jawPivot.rotation.x = 0.05;
            } else {
                // Stationary Emotes: 'think' (Chin-Stroke like sample5.jpg!), 'roar' (Chest-Beat like sample1.jpg!), or 'work'
                j.leftLeg.hipPivot.rotation.x *= 0.85;
                j.leftLeg.kneePivot.rotation.x *= 0.85;
                j.rightLeg.hipPivot.rotation.x *= 0.85;
                j.rightLeg.kneePivot.rotation.x *= 0.85;
                j.pelvisGroup.position.y = 3.1 + Math.sin(now * 0.003) * 0.06;
                j.pelvisGroup.rotation.z = 0;

                if (c.animMode === 'think') {
                    // Iconic B&W2 Lion Pose from sample5.jpg: Hand raised stroking chin thoughtfully!
                    j.spineGroup.rotation.x = 0.08;
                    j.rightArm.shoulderPivot.rotation.x = -1.15;
                    j.rightArm.shoulderPivot.rotation.z = -0.25;
                    j.rightArm.elbowPivot.rotation.x = -1.45 + Math.sin(now * 0.005) * 0.12;
                    j.leftArm.shoulderPivot.rotation.x = 0.15;
                    j.leftArm.elbowPivot.rotation.x = -0.35;
                    j.headGroup.rotation.x = 0.14 + Math.sin(now * 0.003) * 0.05;
                    j.jawPivot.rotation.x = 0.04;
                } else if (c.animMode === 'roar') {
                    // Iconic B&W2 Gorilla/Titan Roar from sample1.jpg: Arms wide / chest beat + open jaw!
                    const beat = Math.sin(now * 0.014);
                    j.spineGroup.rotation.x = -0.12;
                    j.leftArm.shoulderPivot.rotation.x = -0.85 + beat * 0.35;
                    j.leftArm.elbowPivot.rotation.x = -0.9;
                    j.rightArm.shoulderPivot.rotation.x = -0.85 - beat * 0.35;
                    j.rightArm.elbowPivot.rotation.x = -0.9;
                    j.jawPivot.rotation.x = 0.42 + Math.abs(beat) * 0.22;
                } else if (c.animMode === 'work') {
                    // Heavy rhythmic building/hammering motion
                    const swing = Math.sin(now * 0.012);
                    j.spineGroup.rotation.x = 0.22 + swing * 0.12;
                    j.rightArm.shoulderPivot.rotation.x = -0.9 + swing * 0.65;
                    j.rightArm.elbowPivot.rotation.x = -0.6;
                    j.leftArm.shoulderPivot.rotation.x = -0.7 - swing * 0.45;
                    j.leftArm.elbowPivot.rotation.x = -0.6;
                }
            }

            if (j.tailPivot) {
                j.tailPivot.rotation.z = Math.sin(now * 0.0042) * 0.32;
                j.tailPivot.rotation.x = Math.cos(now * 0.0028) * 0.14;
            }
            if (j.headGroup) {
                j.headGroup.rotation.y = Math.sin(now * 0.0022) * 0.22;
            }

            c.mesh.position.y = getTerrainHeight(c.mesh.position.x, c.mesh.position.z);
        }
<!-- ... existing code ... -->
            // Temple Beacon & Animated Construction Cranes / Fire & Smoke Plumes
            const crystal = templeGroup.getObjectByName('manaCrystal');
            if (crystal) {
                crystal.rotation.y += rawDt * 0.8;
            }
            buildings.forEach(b => {
                if (b.windmillSails && b.state !== 'ruins') {
                    b.windmillSails.rotation.z += rawDt * 1.2;
                }
                if (b.state === 'constructing' && b.cranePivot) {
                    b.cranePivot.rotation.y = Math.sin(now * 0.0015 + b.x) * 0.85;
                }
                if (b.fireSmokeGroup && b.fireSmokeGroup.visible) {
                    b.fireSprites.forEach((fs, idx) => {
                        const flicker = 2.0 + Math.sin(now * 0.018 + idx * 1.7) * 0.45;
                        fs.scale.set(flicker, flicker * 1.25, 1);
                    });
                    b.smokeSprites.forEach((ss) => {
                        ss.position.y += rawDt * 1.8;
                        if (ss.position.y > 9.5) ss.position.y = 2.8;
                    });
                }
            });

            // Animate Articulated Human Villagers & Builder Construction Sparks
            villagers.forEach(v => {
                if (state.heldObject === v) return;
                v.userData.timer -= dt;

                const unfinished = buildings.find(b => b.buildProgress < 100 || (b.hp < b.maxHp && b.hp > 0));
                if (v.userData.role === 'Baumeister' && unfinished) {
                    v.userData.targetX = unfinished.x + 2.1;
                    v.userData.targetZ = unfinished.z + 2.1;
                } else if (v.userData.timer <= 0) {
                    v.userData.timer = 4 + Math.random() * 5;
                    const r = 7 + Math.random() * 22;
                    const a = Math.random() * Math.PI * 2;
                    v.userData.targetX = Math.cos(a) * r;
                    v.userData.targetZ = Math.sin(a) * r;
                }

                const dx = v.userData.targetX - v.position.x;
                const dz = v.userData.targetZ - v.position.z;
                const d = Math.hypot(dx, dz);
                const limbs = v.userData.limbs;

                if (d > 0.45) {
                    v.position.x += (dx / d) * 3.1 * dt;
                    v.position.z += (dz / d) * 3.1 * dt;
                    v.position.y = getTerrainHeight(v.position.x, v.position.z);
                    v.rotation.y = Math.atan2(dx, dz);

                    v.userData.walkPhase += dt * 9.0;
                    if (limbs) {
                        limbs.leftLegPivot.rotation.x = Math.sin(v.userData.walkPhase) * 0.6;
                        limbs.rightLegPivot.rotation.x = -Math.sin(v.userData.walkPhase) * 0.6;
                        limbs.leftArmPivot.rotation.x = -Math.sin(v.userData.walkPhase) * 0.5;
                        limbs.rightArmPivot.rotation.x = Math.sin(v.userData.walkPhase) * 0.5;
                    }
                } else if (limbs) {
                    limbs.leftLegPivot.rotation.x *= 0.85;
                    limbs.rightLegPivot.rotation.x *= 0.85;
                    limbs.rightArmPivot.rotation.x = -0.65 + Math.sin(now * 0.014) * 0.62;
                    if (unfinished && Math.hypot(unfinished.x - v.position.x, unfinished.z - v.position.z) < 4.8) {
                        unfinished.buildProgress = Math.min(100, unfinished.buildProgress + dt * 5.8);
                        unfinished.hp = Math.min(unfinished.maxHp, unfinished.hp + dt * 3.8);
                        updateBuildingVisualState(unfinished);

                        // Spawn flying construction woodchips/sparks while hammering!
                        v.userData.sparkTimer = (v.userData.sparkTimer || 0) - rawDt;
                        if (v.userData.sparkTimer <= 0) {
                            v.userData.sparkTimer = 0.45;
                            spawnMiracleParticles(v.position, 0xfde047, 2);
                        }
                    }
                }
            });

            economyAccumulator += dt;
            if (economyAccumulator >= 2.8) {
                economyAccumulator = 0;
                const seasonMult = SEASONS[state.time.seasonIndex].foodMult;
                state.resources.food += 3 * seasonMult;
                state.resources.wood += 2;
                state.resources.mana = Math.min(999, state.resources.mana + 4);
                addFaith(1.4);
                if (villagers.length < state.resources.maxPop && state.resources.food > 90 && Math.random() < 0.3) {
                    spawnVillager((Math.random() - 0.5) * 14, (Math.random() - 0.5) * 14, 'Bauer');
                }
                updateHUD();
            }

            updateCreatureAI(dt, now);

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                if (p.userData.vx !== undefined) {
                    p.position.x += p.userData.vx * rawDt;
                    p.position.z += p.userData.vz * rawDt;
                    p.userData.vy -= (p.userData.gravity || 12) * rawDt;
                }
                p.position.y += p.userData.vy * rawDt;
                const floorY = getTerrainHeight(p.position.x, p.position.z);
                if (p.position.y < floorY + 0.15 && p.userData.gravity) {
                    p.position.y = floorY + 0.15;
                    p.userData.vy *= -0.35;
                    p.userData.vx *= 0.6;
                    p.userData.vz *= 0.6;
                }
                p.userData.life -= rawDt;
                if (p.userData.life <= 0) {
                    scene.remove(p);
                    particles.splice(i, 1);
                }
            }

            renderer.render(scene, camera);
        }

        window.onload = function() {
            renderCreatureSlotBars();
            updateHUD();
            requestAnimationFrame(animate);
        };
    </script>
